; Pick a test in PlatformIO > Project Tasks, then click Upload and Monitor.
; Opening a .cpp does not select it for upload. Select its environment too.
[platformio]
default_envs = hello

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I src/common
    -I config
    -I src/drivers

[bench]
build_src_filter = +<drivers/*.cpp>

[env:hello]
build_src_filter = +<bench/setup_1_esp32_serial.cpp>
upload_port = COM9
monitor_port = COM9
upload_speed = 115200

[env:buttons]
build_src_filter = +<bench/sensor_1_doll_buttons.cpp>

[env:pressure]
build_src_filter = +<bench/sensor_2_fsr402_pressure.cpp>

[env:rfid]
build_src_filter = +<bench/sensor_3_rc522_rfid.cpp>
lib_deps = miguelbalboa/MFRC522@1.4.12

[env:microphone]
build_src_filter = +<bench/sensor_4_inmp441_microphone.cpp>

[env:motion]
build_src_filter = +<bench/sensor_5_hcsr501_motion.cpp>

[env:doll_i2c]
build_src_filter = +<bench/sensor_6_doll_i2c_scan.cpp>

[env:doll_oled]
build_src_filter = +<bench/sensor_7_doll_ssd1306_oled.cpp>
lib_deps = adafruit/Adafruit SSD1306@2.5.13

[env:gateway_i2c]
build_src_filter = +<bench/gateway_1_i2c_scan.cpp>

[env:light]
build_src_filter = +<bench/gateway_2_bh1750_light.cpp>

[env:p2_i2c_scan]
build_src_filter = ${bench.build_src_filter} +<bench/p2_i2c_scan.cpp>

[env:p2_light]
build_src_filter = ${bench.build_src_filter} +<bench/p2_light.cpp>

[env:p2_distance]
build_src_filter = +<bench/p2_distance.cpp>

[env:p3_cloud]
build_src_filter = ${bench.build_src_filter} +<bench/p3_cloud.cpp>

[env:distance]
build_src_filter = +<bench/gateway_3_hcsr04_distance.cpp>

[env:gateway_oled]
build_src_filter = +<bench/gateway_4_ssd1306_oled.cpp>
lib_deps = adafruit/Adafruit SSD1306@2.5.13

[env:ack_button]
build_src_filter = +<bench/gateway_5_ack_button.cpp>

[env:servos]
build_src_filter = +<bench/puppet_1_servos_power_stop.cpp>

[env:speaker]
build_src_filter = +<bench/puppet_2_max98357a_speaker.cpp>

[env:bme280]
build_src_filter = +<bench/optional_1_bme280_environment.cpp>
lib_deps = adafruit/Adafruit BME280 Library@2.3.0

[env:gateway_oled_sh1106]
build_src_filter = +<bench/gateway_4_sh1106_oled.cpp>
lib_deps = adafruit/Adafruit SH110X@2.1.15

[env:doll_oled_sh1106]
build_src_filter = +<bench/sensor_7_doll_sh1106_oled.cpp>
lib_deps = adafruit/Adafruit SH110X@2.1.15
