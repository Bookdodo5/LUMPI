; Pick a test in PlatformIO > Project Tasks, then click Upload and Monitor.
; Opening a .cpp does not select it for upload. Select its environment too.
; Work top to bottom: the number in each name is its stage in docs/testing-steps.md.
; Every pin is in config/settings.h; every secret/address in config/private.h.
[platformio]
default_envs = s0_hello

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; Typing in the Monitor: what you type is shown, and sent when you press Enter.
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
upload_speed = 921600   ; fastest; if uploads fail with "timed out" or "invalid head", use 460800
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I src/common
    -I config
    -I src/drivers

[bench]
build_src_filter = +<drivers/*.cpp>

; ---------------------------------------------------------------------------
; STAGE 0. SETUP: bare board, USB only.
; ---------------------------------------------------------------------------
[env:s0_hello]
build_src_filter = +<bench/0_setup/0_hello.cpp>
upload_port = COM9
monitor_port = COM9
upload_speed = 115200

; ---------------------------------------------------------------------------
; STAGE 1. DOLL PARTS, one at a time. Wire only the part being tested.
; Screen: pick _sh1106 if your OLED is an SH1106.
; ---------------------------------------------------------------------------
[env:s1a_buttons]
build_src_filter = +<bench/1_doll_parts/1a_buttons.cpp>

[env:s1b_pressure]
build_src_filter = +<bench/1_doll_parts/1b_pressure.cpp>

[env:s1c_rfid]
build_src_filter = +<bench/1_doll_parts/1c_rfid.cpp>
lib_deps = miguelbalboa/MFRC522@1.4.12

[env:s1d_microphone]
build_src_filter = +<bench/1_doll_parts/1d_microphone.cpp>

[env:s1e_i2c_scan]
build_src_filter = +<bench/1_doll_parts/1e_i2c_scan.cpp>

[env:s1f_screen]
build_src_filter = +<bench/1_doll_parts/1f_screen_ssd1306.cpp>
lib_deps = adafruit/Adafruit SSD1306@2.5.13

[env:s1f_screen_sh1106]
build_src_filter = +<bench/1_doll_parts/1f_screen_sh1106.cpp>
lib_deps = adafruit/Adafruit SH110X@2.1.15

[env:s1g_servos]
build_src_filter = +<bench/1_doll_parts/1g_servos.cpp>

[env:s1h_speaker]
build_src_filter = +<bench/1_doll_parts/1h_speaker.cpp>

[env:s1h_speaker_melody]
build_src_filter = +<bench/1_doll_parts/1h_speaker_melody.cpp>

[env:s1h_speaker_melody_alt]
build_src_filter = +<bench/1_doll_parts/1h_speaker_melody.cpp>
build_flags = ${env.build_flags} -DALT_SPEAKER_PINS

[env:s1i_mic_to_speaker]
build_src_filter = +<bench/1_doll_parts/1i_mic_to_speaker.cpp>

; ---------------------------------------------------------------------------
; STAGE 2. NEST PARTS, one at a time.
; ---------------------------------------------------------------------------
[env:s2a_i2c_scan]
build_src_filter = +<bench/2_nest_parts/2a_i2c_scan.cpp>

[env:s2b_light]
build_src_filter = +<bench/2_nest_parts/2b_light.cpp>

[env:s2c_distance]
build_src_filter = +<bench/2_nest_parts/2c_distance.cpp>

[env:s2d_screen]
build_src_filter = +<bench/2_nest_parts/2d_screen_ssd1306.cpp>
lib_deps = adafruit/Adafruit SSD1306@2.5.13

[env:s2d_screen_sh1106]
build_src_filter = +<bench/2_nest_parts/2d_screen_sh1106.cpp>
lib_deps = adafruit/Adafruit SH110X@2.1.15

[env:s2e_ack_button]
build_src_filter = +<bench/2_nest_parts/2e_ack_button.cpp>

[env:s2f_bme280_optional]
build_src_filter = +<bench/2_nest_parts/2f_bme280_optional.cpp>
lib_deps = adafruit/Adafruit BME280 Library@2.3.0

; ---------------------------------------------------------------------------
; STAGE 3 + 4. FULL BOARD CHECKS: every part of one board, all wired.
; Monitor so you can type answers:
;   pio device monitor -b 115200 --echo --eol LF --filter send_on_enter
; ---------------------------------------------------------------------------
[env:s3_doll_check]
build_src_filter = +<bench/3_full_doll/3_doll_check.cpp>
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    miguelbalboa/MFRC522@1.4.12

[env:s3_doll_check_sh1106]
build_src_filter = +<bench/3_full_doll/3_doll_check.cpp>
build_flags = ${env.build_flags} -DUSE_SH1106
lib_deps =
    adafruit/Adafruit SH110X@2.1.15
    miguelbalboa/MFRC522@1.4.12

[env:s4_nest_check]
build_src_filter = +<bench/4_full_nest/4_nest_check.cpp>
lib_deps = adafruit/Adafruit SSD1306@2.5.13

[env:s4_nest_check_sh1106]
build_src_filter = +<bench/4_full_nest/4_nest_check.cpp>
build_flags = ${env.build_flags} -DUSE_SH1106
lib_deps = adafruit/Adafruit SH110X@2.1.15

; ---------------------------------------------------------------------------
; STAGE 5. DOLL <-> NEST. Also used by stage 7 and 8: same sketches, with
; LUMPI_ADAPTER_URL set in config/private.h so the nest forwards to the cloud.
; Nest: s5_nest. Dolls: s5_doll (doll 1), s5_doll_2 (doll 2).
; ---------------------------------------------------------------------------
[env:s5_nest]
build_src_filter = ${bench.build_src_filter} +<bench/5_doll_nest/5_nest.cpp>
upload_port = COM9     ; this laptop: the nest board. Other laptops: change or delete these two lines.
monitor_port = COM9

[env:s5_doll]
build_src_filter = +<bench/5_doll_nest/5_doll.cpp>
lib_deps = miguelbalboa/MFRC522@1.4.12
upload_port = COM10    ; this laptop: the doll board. Other laptops: change or delete these two lines.
monitor_port = COM10

[env:s5_doll_2]
build_src_filter = +<bench/5_doll_nest/5_doll.cpp>
build_flags = ${env.build_flags} -DLUMPI_NODE_ID=2
lib_deps = miguelbalboa/MFRC522@1.4.12

; ---------------------------------------------------------------------------
; STAGE 6. NEST -> CLOUD: nest sensors to the dashboard.
; ---------------------------------------------------------------------------
[env:s6_nest_to_dashboard]
build_src_filter = ${bench.build_src_filter} +<bench/6_nest_cloud/6_nest_to_dashboard.cpp>

; ---------------------------------------------------------------------------
; STAGE 9. REAL DOLL FIRMWARE (src/app/station/). Use doll_sh1106 for SH1106 OLED.
; ---------------------------------------------------------------------------
[env:doll]
build_src_filter = +<app/station/doll.cpp>
extra_scripts = pre:tools/pio_doll_data.py  ; phrases from data_doll/
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    miguelbalboa/MFRC522@1.4.12

[env:doll_2]
build_src_filter = +<app/station/doll.cpp>
extra_scripts = pre:tools/pio_doll_data.py  ; phrases from data_doll/
build_flags = ${env.build_flags} -DLUMPI_NODE_ID=2
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    miguelbalboa/MFRC522@1.4.12

[env:doll_sh1106]
build_src_filter = +<app/station/doll.cpp>
extra_scripts = pre:tools/pio_doll_data.py  ; phrases from data_doll/
build_flags = ${env.build_flags} -DUSE_SH1106
lib_deps =
    adafruit/Adafruit SH110X@2.1.15
    miguelbalboa/MFRC522@1.4.12

; ---------------------------------------------------------------------------
; STAGE 10. REAL NEST FIRMWARE (src/app/gateway/). Use nest_sh1106 for an SH1106 OLED.
; ---------------------------------------------------------------------------
[env:nest]
build_src_filter = ${bench.build_src_filter} +<app/gateway/nest.cpp>
lib_deps = adafruit/Adafruit SSD1306@2.5.13

[env:nest_sh1106]
build_src_filter = ${bench.build_src_filter} +<app/gateway/nest.cpp>
build_flags = ${env.build_flags} -DUSE_SH1106
lib_deps = adafruit/Adafruit SH110X@2.1.15
